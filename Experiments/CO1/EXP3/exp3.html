<!DOCTYPE html>
<html>
<head>
    <title>Images, Hyperlinks and Iframe</title>
</head>

<body>

<h1>Welcome to My College Website</h1>

<!-- Image -->

<img src="college.jpg"
     alt="College Image"
     width="400"
     height="250">

<br><br>

<!-- Hyperlink -->

<a href="https://www.google.com" target="_blank">
Visit Google
</a>

<br><br>

<!-- Iframe -->

<iframe
src="https://www.wikipedia.org"
width="600"
height="400">
</iframe>

</body>
</html>
