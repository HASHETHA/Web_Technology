<!DOCTYPE html>
<html>
<head>
    <title>Student Result Analysis</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
            margin: 30px;
        }

        form {
            background-color: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }

        table {
            margin: 25px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px 20px;
        }

        th {
            background-color: navy;
            color: white;
        }

        #result {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Student Result Analysis System</h1>

    <!-- Student Form -->

    <form onsubmit="addStudent(); return false;">

        <label>Student Name:</label><br>
        <input type="text" id="name" required><br>

        <label>Mark 1:</label><br>
        <input type="number" id="mark1" required><br>

        <label>Mark 2:</label><br>
        <input type="number" id="mark2" required><br>

        <label>Mark 3:</label><br>
        <input type="number" id="mark3" required><br>

        <button type="submit">Add Student</button>

    </form>


    <!-- Student Table -->

    <table>

        <tr>
            <th>Name</th>
            <th>Total</th>
            <th>Average</th>
            <th>Result</th>
        </tr>

        <tbody id="studentTable"></tbody>

    </table>


    <div id="result"></div>


    <script>

        // Array to store students
        let students = [];


        // Function to add student
        function addStudent() {

            // Get values from form
            let name = document.getElementById("name").value;

            let mark1 = Number(document.getElementById("mark1").value);
            let mark2 = Number(document.getElementById("mark2").value);
            let mark3 = Number(document.getElementById("mark3").value);


            // Array of marks
            let marks = [mark1, mark2, mark3];


            // Object for student
            let student = {
                name: name,
                marks: marks
            };


            // Add object to array
            students.push(student);


            // Display students
            displayStudents();


            // Clear form
            document.querySelector("form").reset();
        }


        // Function to display students
        function displayStudents() {

            let table = document.getElementById("studentTable");

            table.innerHTML = "";


            // Loop through students
            for (let i = 0; i < students.length; i++) {

                let student = students[i];

                let total = 0;


                // Loop through marks
                for (let j = 0; j < student.marks.length; j++) {
                    total = total + student.marks[j];
                }


                let average = total / student.marks.length;


                // Conditional statement
                let result;

                if (average >= 40) {
                    result = "PASS";
                }
                else {
                    result = "FAIL";
                }


                // Add row to table
                table.innerHTML +=
                    "<tr>" +
                    "<td>" + student.name + "</td>" +
                    "<td>" + total + "</td>" +
                    "<td>" + average.toFixed(2) + "</td>" +
                    "<td>" + result + "</td>" +
                    "</tr>";
            }


            // Find highest and lowest marks
            findHighestLowest();
        }


        // Function to find highest and lowest marks
        function findHighestLowest() {

            let allMarks = [];


            // Loop through students
            for (let i = 0; i < students.length; i++) {

                for (let j = 0; j < students[i].marks.length; j++) {

                    allMarks.push(students[i].marks[j]);

                }
            }


            if (allMarks.length > 0) {

                let highest = Math.max(...allMarks);
                let lowest = Math.min(...allMarks);


                document.getElementById("result").innerHTML =
                    "Highest Mark: " + highest +
                    "<br>Lowest Mark: " + lowest;
            }
        }

    </script>

</body>
</html>
