<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        .cart {
            width: 600px;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: navy;
            color: white;
        }
    </style>
</head>

<body>

    <div class="cart">

        <h1>Shopping Cart</h1>

        <form onsubmit="addProduct(); return false;">

            <input type="text" id="product"
                   placeholder="Product Name" required>

            <input type="number" id="price"
                   placeholder="Price" required>

            <input type="number" id="quantity"
                   placeholder="Quantity" required>

            <button>Add Product</button>

        </form>


        <table>

            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
            </tr>

            <tbody id="cart"></tbody>

        </table>


        <h3 id="bill"></h3>

    </div>


    <script>

        // Array
        let products = [];


        // Add product
        function addProduct() {

            let name =
                document.getElementById("product").value;

            let price =
                Number(document.getElementById("price").value);

            let quantity =
                Number(document.getElementById("quantity").value);


            // Object
            let product = {
                name: name,
                price: price,
                quantity: quantity
            };


            products.push(product);

            displayCart();

            document.querySelector("form").reset();
        }


        // Display cart
        function displayCart() {

            let cart =
                document.getElementById("cart");

            cart.innerHTML = "";

            let subtotal = 0;


            for (let i = 0; i < products.length; i++) {

                let total =
                    products[i].price *
                    products[i].quantity;

                subtotal = subtotal + total;


                cart.innerHTML +=
                    "<tr>" +
                    "<td>" + products[i].name + "</td>" +
                    "<td>" + products[i].price + "</td>" +
                    "<td>" + products[i].quantity + "</td>" +
                    "<td>" + total + "</td>" +
                    "</tr>";
            }


            // Discount
            let discount = 0;

            if (subtotal >= 1000) {
                discount = subtotal * 0.10;
            }


            // Tax
            let tax = (subtotal - discount) * 0.05;


            // Final total
            let finalTotal =
                subtotal - discount + tax;


            document.getElementById("bill").innerHTML =
                "Subtotal: ₹" + subtotal +
                "<br>Discount: ₹" + discount.toFixed(2) +
                "<br>Tax: ₹" + tax.toFixed(2) +
                "<br><b>Final Total: ₹" +
                finalTotal.toFixed(2) + "</b>";
        }

    </script>

</body>
</html>
