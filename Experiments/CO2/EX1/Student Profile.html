<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>
<style>
body {
    font-family: Arial;
    background-color: lightgray;
    margin: 0;
    padding: 20px;
}
.profile {
    border: 2px solid black;
    padding: 20px;
    margin: 20px auto;
    width: 70%;
}
.intro {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
}

.text {
    flex: 1;
}

.intro img {
    width: 180px;
    height: 180px;
    object-fit: cover;
}

</style>
</head>

<body>
<div class="profile">
    <h1>HASHETHA MAGESH</h1>

    <div class="intro">
        <div class="text">
            <h2>About Me</h2>
            <p>
                Myself HASHETHA Magesh, I am a B.Tech IT student
                who has some skills as follows:
            </p>

            <ul>
                <li>Java Programming</li>
                <li>Python Programming</li>
                <li>MySQL</li>
                <li>C Programming</li>
                <li>Engineering Mathematics</li>
            </ul>
        </div>

        <img src="profile.jpg" alt="Profile Photo">
    </div>
</div>
</body>
</html>
